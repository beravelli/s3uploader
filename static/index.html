<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S3 Photo Uploader</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
  <header>
    <h1>📸 S3 Photo Uploader</h1>
  </header>

  <main>
    <section id="upload-zone" class="card">
      <div id="drop-area">
        <p>Drop photos here or <label for="file-input" class="browse-link">browse</label></p>
        <input type="file" id="file-input" accept="image/*" hidden>
      </div>
      <div class="upload-controls">
        <label for="storage-class">Storage class:</label>
        <select id="storage-class">
          <option value="STANDARD">S3 Standard — instant access (~$0.023/GB)</option>
          <option value="DEEP_ARCHIVE">Glacier Deep Archive — 12h+ retrieval (~$0.001/GB)</option>
        </select>
      </div>
      <div id="progress-wrap" hidden>
        <div id="progress-track"><div id="progress-bar"></div></div>
        <span id="progress-pct">0%</span>
      </div>
      <p id="upload-error" class="error" hidden></p>
    </section>

    <section id="result-panel" class="card" hidden>
      <div class="result-grid">
        <div class="preview-col">
          <img id="preview-img" alt="Preview">
          <p id="upload-meta"></p>
        </div>
        <div class="info-col">
          <div id="exif-section">
            <h2>Camera Info</h2>
            <table id="exif-table"></table>
            <p id="exif-empty" hidden>No EXIF data in this image.</p>
          </div>
          <div id="color-section">
            <h2>Dominant Colors</h2>
            <div id="color-swatches"></div>
          </div>
        </div>
      </div>
      <div id="map-section" hidden>
        <h2>Location</h2>
        <div id="map"></div>
      </div>
    </section>

    <section id="files-section" class="card">
      <h2>Uploaded Files</h2>
      <ul id="file-list"><li class="muted">Loading…</li></ul>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/js/app.js"></script>
</body>
</html>
